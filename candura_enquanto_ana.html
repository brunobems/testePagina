const quiz = document.getElementById("quiz");

perguntas.forEach((q,index)=>{



let html = `
<div class="questao">
<h3>Questão ${index+1}</h3>
<p>${q.pergunta}</p>
`;

q.alternativas.forEach((alt,i)=>{
html += `
<label>
<input type="radio" name="q${index}" value="${i}">
${String.fromCharCode(65+i)}) ${alt}
</label>`;
});

html += `
<div id="fb${index}" class="feedback"></div>
</div>
`;

quiz.innerHTML += html;

});

function corrigir(){

let acertos = 0;

perguntas.forEach((q,index)=>{



const resposta =
document.querySelector(`input[name="q${index}"]:checked`);

const fb =
document.getElementById(`fb${index}`);

if(resposta){

if(Number(resposta.value) === q.correta){

acertos++;

fb.className="feedback correta";

fb.innerHTML=
`✅ Correta!<br><br>${q.explicacao}`;

}else{

fb.className="feedback errada";

fb.innerHTML=
`❌ Resposta correta:
<b>${String.fromCharCode(65+q.correta)}) ${q.alternativas[q.correta]}</b>
<br><br>${q.explicacao}`;

}

}else{

fb.className="feedback errada";

fb.innerHTML=
`❌ Questão não respondida.<br>
Resposta correta:
<b>${String.fromCharCode(65+q.correta)}) ${q.alternativas[q.correta]}</b>
<br><br>${q.explicacao}`;
}

fb.style.display="block";

});

const percentual =
((acertos/perguntas.length)*100).toFixed(1);

let medalha="🥉 Bronze";

if(percentual>=85) medalha="🥇 Ouro";
else if(percentual>=70) medalha="🥈 Prata";

document.getElementById("barra").style.width =
percentual + "%";

document.getElementById("resultado").style.display="block";

document.getElementById("resultado").innerHTML = `
<h2>Resultado Final</h2>

<p><strong>Acertos:</strong>
${acertos} de ${perguntas.length}</p>

<p><strong>Aproveitamento:</strong>
${percentual}%</p>

<p class="medalha">${medalha}</p>
`;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

</script>
