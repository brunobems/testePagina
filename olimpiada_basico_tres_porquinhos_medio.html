<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpíada de Literatura - Básico</title>
</head>

<body>
     

    <h1>🏆 Olimpíada de Literatura - Os Três Porquinhos</h1>
    <p>Nível Intermediaria - 20 questões</p>
    <script>
        const questoesInt = [


            {
                pergunta: 'Qual dos porquinhos saiu de casa primeiro?',
                opcoes: ['O mais novo', 'O do meio', 'O mais velho', 'Todos juntos'],
                correta: 2,
                explicacao: 'O texto informa que o porquinho mais velho saiu primeiro em busca da própria sorte.'
            },
            {
                pergunta: 'Como os porquinhos pediam ajuda aos homens que encontravam?',
                opcoes: ['Com arrogância', 'Com educação', 'Com medo', 'Com pressa'],
                correta: 1,
                explicacao: 'Os três porquinhos foram educados quando pediram os materiais para construir suas casas.'
            },
            {
                pergunta: 'Por que os homens decidiram ajudar os porquinhos?',
                opcoes: ['Porque receberam dinheiro', 'Porque tinham medo deles', 'Porque eram educados', 'Porque eram parentes'],
                correta: 2,
                explicacao: 'Os homens gostaram da educação demonstrada pelos porquinhos.'
            },
            {
                pergunta: 'Qual característica aparece várias vezes no comportamento do lobo?',
                opcoes: ['Preguiça', 'Persistência', 'Bondade', 'Generosidade'],
                correta: 1,
                explicacao: 'Mesmo fracassando muitas vezes, o lobo continuava tentando capturar o porquinho.'
            },
            {
                pergunta: 'Por que a casa de tijolos era mais segura?',
                opcoes: ['Era mais bonita', 'Era mais resistente', 'Era maior', 'Era mais colorida'],
                correta: 1,
                explicacao: 'Os tijolos tornavam a casa muito mais forte que as demais.'
            },
            {
                pergunta: 'O terceiro porquinho demonstrou ser:',
                opcoes: ['Preguiçoso', 'Descuidado', 'Inteligente', 'Desobediente'],
                correta: 2,
                explicacao: 'Ele planejava suas ações e escapava dos planos do lobo.'
            },
            {
                pergunta: 'O que mostrou que o terceiro porquinho era esperto?',
                opcoes: ['Cantava bem', 'Enganou o lobo várias vezes', 'Era o maior', 'Corria mais rápido'],
                correta: 1,
                explicacao: 'Ele usou sua inteligência para evitar ser capturado.'
            },
            {
                pergunta: 'Como o lobo se sentia quando era enganado?',
                opcoes: ['Feliz', 'Entusiasmado', 'Raivoso', 'Calmo'],
                correta: 2,
                explicacao: 'Cada fracasso deixava o lobo ainda mais furioso.'
            },
            {
                pergunta: 'Por que o porquinho foi mais cedo ao campo de nabos?',
                opcoes: ['Para evitar encontrar o lobo', 'Porque se perdeu', 'Porque estava atrasado', 'Porque queria passear'],
                correta: 0,
                explicacao: 'Ele saiu antes e voltou para casa antes da chegada do lobo.'
            },
            {
                pergunta: 'Por que o porquinho jogou a maçã para longe?',
                opcoes: ['Porque não gostava dela', 'Para distrair o lobo', 'Porque estava estragada', 'Para guardar depois'],
                correta: 1,
                explicacao: 'Enquanto o lobo buscava a maçã, o porquinho conseguiu fugir.'
            },
            {
                pergunta: 'A atitude de jogar a maçã mostra qual qualidade do porquinho?',
                opcoes: ['Esperteza', 'Preguiça', 'Timidez', 'Vaidade'],
                correta: 0,
                explicacao: 'Ele encontrou uma maneira inteligente de escapar do perigo.'
            },
            {
                pergunta: 'Qual era o verdadeiro objetivo do lobo ao marcar encontros?',
                opcoes: ['Fazer amizade', 'Conhecer lugares', 'Capturar o porquinho', 'Brincar'],
                correta: 2,
                explicacao: 'O lobo queria aproveitar uma oportunidade para pegar o porquinho.'
            },
            {
                pergunta: 'O terceiro porquinho confiava totalmente no lobo?',
                opcoes: ['Sim', 'Não', 'Às vezes', 'Somente no começo'],
                correta: 1,
                explicacao: 'Ele desconfiava das intenções do lobo.'
            },
            {
                pergunta: 'Como o terceiro porquinho resolvia seus problemas?',
                opcoes: ['Usando a força', 'Pedindo ajuda', 'Usando inteligência', 'Escondendo-se sempre'],
                correta: 2,
                explicacao: 'Sua principal característica era a inteligência.'
            },
            {
                pergunta: 'A casa de tijolos pode representar:',
                opcoes: ['Planejamento e dedicação', 'Pressa', 'Preguiça', 'Sorte'],
                correta: 0,
                explicacao: 'Ela exige mais trabalho, paciência e cuidado.'
            },
            {
                pergunta: 'Qual foi a primeira ideia do lobo após não derrubar a casa?',
                opcoes: ['Subir na chaminé', 'Ir embora', 'Convidar o porquinho para buscar nabos', 'Chamar ajuda'],
                correta: 2,
                explicacao: 'O lobo tentou atrair o porquinho para fora de casa.'
            },
            {
                pergunta: 'O que significa a expressão "soprar e bufar"?',
                opcoes: ['Dormir profundamente', 'Fazer grande esforço', 'Cantar alto', 'Falar devagar'],
                correta: 1,
                explicacao: 'A expressão mostra que o lobo estava se esforçando muito.'
            },
            {
                pergunta: 'Qual casa exigiu mais trabalho para ser construída?',
                opcoes: ['Palha', 'Galhos', 'Tijolos', 'Todas igualmente'],
                correta: 2,
                explicacao: 'A casa de tijolos levou mais tempo e dedicação.'
            },
            {
                pergunta: 'O que o lobo fez ao ver a manteigueira rolando?',
                opcoes: ['Riu bastante', 'Tentou pegá-la', 'Fugiu assustado', 'Empurrou a manteigueira'],
                correta: 2,
                explicacao: 'Ele acreditou que era algo assustador.'
            },
            {
                pergunta: 'Qual é o principal conflito da história?',
                opcoes: ['A fome da mãe dos porquinhos', 'A perseguição do lobo ao porquinho', 'A construção das casas', 'A ida à feira'],
                correta: 1,
                explicacao: 'Toda a narrativa gira em torno das tentativas do lobo de capturar os porquinhos.'
            }


        ];
        document.write('<form>'); questoesInt.forEach((q, i) => {
            document.write('<h3>' + (i + 1) + '. ' + q.pergunta + '</h3>');
            q.opcoes.forEach((o, j) => document.write('<label><input type=radio name=q' + i + ' value=' + j + '>' + o + '</label><br>')); document.write('<div id=e' + i + '></div><hr>');
        }); document.write('</form><button onclick="corrigir()">Finalizar basico</button><div id=res></div>'); function corrigir() { let p = 0; questoesInt.forEach((q, i) => { let r = document.querySelector('input[name=q' + i + ']:checked'); let e = document.getElementById('e' + i); if (r && +r.value === q.correta) { p++; e.innerHTML = '✅ ' + q.explicacao } else { e.innerHTML = '❌ ' + q.explicacao } }); document.getElementById('res').innerHTML = 'Acertos: ' + p + '/' + questoesInt.length; }
    </script>

    



</body>

</html>
